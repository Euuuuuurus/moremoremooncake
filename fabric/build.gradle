plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = rootProject.archives_base_name + "-fabric"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    // Base more_mooncake classes only at compile time; the base mod is a runtime requirement.
    modCompileOnly files("${rootProject.projectDir}/libs/more-mooncake-common.jar")

    // Runtime: the built base Fabric mod jar so `runServer` loads the base mod too.
    modRuntimeOnly files("${rootProject.projectDir}/run-mods/more-mooncake-fabric-1.0.0.jar")

    // JEI at dev-runtime only: lets runClient/runServer actually load JEI and the
    // @JeiPlugin classes for verification. Never packaged into the release jar.
    // (Local patched copy: upstream 19.57 jar declares Fabric-Loom-Version 1.18.2 which
    // our Loom 1.7 rejects; patched to 1.7.435, functionally identical.)
    modRuntimeOnly files("${rootProject.projectDir}/run-mods/jei-1.21.1-fabric-19.57.0.448-loom17.jar")
    // JEI embeds mezz_config via jar-in-jar; dev runs need it as a standalone mod dependency.
    // (mezz_config also declares a newer Fabric-Loom-Version; patched copy used, same as JEI.)
    modRuntimeOnly files("${rootProject.projectDir}/run-mods/mezz_config-1.21.1-fabric-0.5.12-loom17.jar")
}

loom {
    runs {
        server {
            ideConfigGenerated = true
            programArgs "--nogui"
            runDir "run"
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "more_mooncake.accesswidener"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
    repositories {
    }
}