# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.vfs.watch=false

# Mod
mod_version=1.0.0
maven_group=com.moremoremooncake
archives_base_name=moremooncake-addon
enabled_platforms=fabric,neoforge

# Minecraft (must match the base more_mooncake mod)
minecraft_version=1.21.1

# Architectury
architectury_version=13.0.8

# Fabric (0.116.5+ required by JEI 19.57 at dev-runtime; the release jar depends on fabric-api:*)
fabric_loader_version=0.16.10
fabric_api_version=0.116.5+1.21.1

# NeoForge
neo_forge_version=21.1.238

# JEI (optional integration, same version on both loaders; 21.1.238+ required by JEI 19.57)
jei_version=19.57.0.448