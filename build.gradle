plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.2.2" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    version = rootProject.mod_version
    group = rootProject.maven_group

    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }

        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common

        // Files in this configuration will be bundled into the mod using the Shadow plugin.
        shadowBundle {
            canBeResolved = true
            canBeConsumed = false
        }
    }

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.blamejared.com/" }
        mavenCentral()
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name + "-" + project.name
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
    }

    if (project.name == "common") {
        dependencies {
            implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            implementation "dev.architectury:architectury:${rootProject.architectury_version}"

            // The independent addon compiles against the base more_mooncake common classes.
            // The base mod itself is installed separately at runtime (this is a true addon),
            // so it is only a compile-only dependency here.
            implementation files("${rootProject.projectDir}/libs/more-mooncake-common.jar")

            // JEI API only - the plugin lives in common and is packaged into both jars.
            // It is never loaded unless JEI is installed (JEI scans @JeiPlugin classes itself).
            compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
        }
    }

    if (project.name == "fabric") {
        dependencies {
            implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
            implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

            // Runtime: the built base Fabric mod jar so `runServer` loads the base mod too.
            runtimeOnly files("${rootProject.projectDir}/run-mods/more-mooncake-fabric-26.3.jar")

            // JEI at dev-runtime only: lets runClient/runServer actually load JEI and the
            // @JeiPlugin classes for verification. Never packaged into the release jar.
            runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
        }
    }

    if (project.name == "neoforge") {
        dependencies {
            neoForge "net.neoforged:neoforge:${rootProject.neo_forge_version}"
            implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

            // Runtime: the built base NeoForge mod jar so `runServer` loads the base mod too.
            runtimeOnly files("${rootProject.projectDir}/run-mods/more-mooncake-neoforge-26.3.jar")

            // JEI at dev-runtime only: lets runClient/runServer actually load JEI and the
            // @JeiPlugin classes for verification. Never packaged into the release jar.
            runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}"
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }
}