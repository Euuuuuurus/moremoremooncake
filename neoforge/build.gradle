plugins {
    id "com.gradleup.shadow"
}

// In a standalone Architectury project the `architectury { neoForge() }` DSL alone does not
// register the `neoForge` configuration that `dependencies { neoForge "..." }` relies on.
// Declare it explicitly and tell Loom this is the NeoForge platform so the NeoForge userdev
// gets processed on to the compile classpath.
ext["loom.platform"] = "neoforge"

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    common(project(path: ":common")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

// 26.x ships an unpacked, unobfuscated minecraft jar; the bundled common output can exceed the
// classic 65535-entry zip limit, so the distributable shadow jar needs the zip64 extension.
tasks.shadowJar {
    zip64 = true
    // Only bundle the common module (via shadowBundle), never the whole runtime classpath.
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
    repositories {
    }
}